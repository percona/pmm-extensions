---
default_language_version:
  python: python3
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 871f3bcae4fe473cd7109c3a068db975dc035e3b  # 0.9.4
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/google/addlicense
    rev: b289835c0741ba2fb92dd5f61af070e79c69a55e  # v1.2.0
    hooks:
      - id: addlicense
        args: ["-f", ".license_header", "-v"]
        types_or: [python, javascript, ts, tsx, css, jinja]
        exclude: ^frontend/(node_modules|.*/dist|packages/[^/]+/src/generated)/
  - repo: local
    hooks:
      - id: update-snippets-checksum-manifest
        name: Update built-in snippets checksum manifest
        description: "Regenerate snippets/builtin-snippets.sha256 when files under snippets/ change"
        entry: python3 scripts/update_snippets_checksum_manifest.py
        language: python
        additional_dependencies: ["aiofiles==24.1.0"]
        files: ^snippets/
        pass_filenames: false
      - id: changelog-fragments
        name: Validate changelog.d/ fragments
        description: "Validate per-PR changelog fragments under changelog.d/"
        entry: python3 scripts/changelog.py check
        language: system
        files: ^changelog\.d/
        pass_filenames: false
      - id: sync-alembic-version-locations
        name: Sync alembic.ini [extensions] version_locations
        description: "Regenerate [extensions] version_locations from app migration dirs"
        entry: python3 scripts/sync_alembic_version_locations.py
        language: system
        files: ^app/extensions/apps/.*/migrations/versions/
        pass_filenames: false
      - id: sync-labeler-apps
        name: Sync .github/labeler.yml app labels
        description: "Regenerate app:<name> labeler rules from app-slice dirs"
        entry: python3 scripts/sync_labeler_apps.py
        language: system
        files: ^(app/extensions/apps/|frontend/packages/apps/|tests/app/extensions/apps/|templates/|frontend/packages/e2e/tests/|\.github/labeler\.yml$|scripts/sync_labeler_apps\.py$)
        pass_filenames: false
      - id: check-nomad-payload-size
        name: Check Nomad payload size
        description: "Ensure dispatch payloads stay under Nomad 16 KiB limit after minify+gzip"
        entry: python3 scripts/check_nomad_payload_size.py
        language: python
        additional_dependencies: ["python-minifier==2.11.3"]
        files: ^app/extensions/apps/(?!dipper/)(?:.*/)?(?:payload(?:/.*)?|[^/]*_payload)$
        pass_filenames: true
      - id: check-sidecar-purge
        name: Check side-car purge layer ordering
        description: "Ensure no apt/dpkg instruction follows the purge layer"
        entry: python3 scripts/check_sidecar_purge.py --check-ordering
        language: system
        files: ^(sidecar/Containerfile\.sidecar|scripts/check_sidecar_purge\.py)$
        pass_filenames: false
      - id: check-pmm-fb-pins
        name: Check the extensions-mysql feature-build pins
        description: "Ensure the pmm-server image, PMM_FB_TAG and NOMAD_VERSION_FB_TAG name one build"
        entry: python3 scripts/check_pmm_fb_pins.py
        language: python
        additional_dependencies: ["pyyaml==6.0.2"]
        files: ^(sidecar/pmm-fb/compose\.yaml|scripts/check_pmm_fb_pins\.py)$
        pass_filenames: false
      - id: gen-xtrabackup-payload-variants
        name: Check xtrabackup payload variants
        description: "Ensure the generated xtrabackup payload variants match the canonical payload"
        entry: python3 scripts/gen_xtrabackup_payload_variants.py --check
        language: system
        files: ^(app/extensions/apps/mysql_backups/(xtrabackup[^/]*payload|payload_variants\.py)|scripts/gen_xtrabackup_payload_variants\.py)$
        pass_filenames: false
      - id: oxfmt
        name: oxfmt (frontend formatter)
        description: "Format frontend code with oxfmt (Prettier-compatible)"
        entry: sh -c 'cd frontend && pnpm exec oxfmt --write .'
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx|mjs|cjs|json|yaml|yml|md|css|scss)$
        exclude: ^frontend/(node_modules|.*/dist)/
        pass_filenames: false
      - id: oxlint
        name: oxlint (frontend linter)
        description: "Lint frontend code with oxlint"
        entry: sh -c 'cd frontend && pnpm exec oxlint --config oxlintrc.json --fix .'
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx|mjs|cjs)$
        exclude: ^frontend/(node_modules|.*/dist)/
        pass_filenames: false

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["--external-sources"]
        types: [shell]
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 2a30809d16bc7a60d9b97353c797f42b510d3368  # v3.12.0-2
    hooks:
      - id: shfmt
        args: ["--diff", "--write", "--indent=4", "--case-indent", "--space-redirects", "--simplify"]
        types: [shell]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # v5.0.0
    hooks:
      - id: check-ast
      - id: check-case-conflict
      - id: check-added-large-files
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: fix-encoding-pragma
        args: ["--remove"]
      - id: trailing-whitespace
...
