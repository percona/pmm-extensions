version: 2
updates:
  # Limit 0 keeps version updates off; entries exist so security PRs get the title prefix.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "fix"
      include: "scope"
    labels:
      - "dependencies"
      - "language:python"
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "fix"
      include: "scope"
    labels:
      - "dependencies"
      - "language:typescript"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "fix"
      include: "scope"
