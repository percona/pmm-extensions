# Main CI workflow

name: CI

on:
  pull_request:
    types:
    - labeled
    - opened
    - ready_for_review
    - reopened
    - synchronize
    - unlabeled
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  label-gate:
    runs-on: ubuntu-latest
    # base_sha / head_sha / head_repo are live from the API so re-runs after a
    # retarget do not keep github.event.pull_request.* from the original
    # event. typecheck_diff consumes all three; paths-filter does not need base_sha
    # because it lists files via the Pull Request Files API (current base).
    outputs:
      base_sha: ${{ steps.verdict.outputs.base_sha }}
      head_sha: ${{ steps.verdict.outputs.head_sha }}
      head_repo: ${{ steps.verdict.outputs.head_repo }}
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout the label tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # One stdlib-only script, and its eligibility mode reads no labeler file.
          sparse-checkout: scripts

      - name: Resolve the merge verdict from the state the PR has now
        id: verdict
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "No pull-request context; nothing to gate."
            echo "protected=false" >> "$GITHUB_OUTPUT"
            echo "base_sha=" >> "$GITHUB_OUTPUT"
            echo "head_sha=" >> "$GITHUB_OUTPUT"
            echo "head_repo=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # github.event replays the original event on a re-run, and freezes the
          # label set at trigger time in every case: read base, head, and labels
          # from the API so a hand retarget is visible to the gate and to
          # consumers of base_sha / head_sha (e.g. typecheck_diff).
          if ! pr="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"; then
            echo "::error::Could not read pull request #$PR_NUMBER."
            exit 1
          fi
          base_ref="$(jq -r '.base.ref' <<<"$pr")"
          base_sha="$(jq -r '.base.sha' <<<"$pr")"
          head_sha="$(jq -r '.head.sha' <<<"$pr")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr")"
          labels="$(jq -r '.labels[].name' <<<"$pr")"
          if [ -z "$base_ref" ] || [ "$base_ref" = "null" ]; then
            echo "::error::Could not resolve the base branch of pull request #$PR_NUMBER."
            exit 1
          fi
          if [ -z "$base_sha" ] || [ "$base_sha" = "null" ]; then
            echo "::error::Could not resolve the base SHA of pull request #$PR_NUMBER."
            exit 1
          fi
          if [ -z "$head_sha" ] || [ "$head_sha" = "null" ]; then
            echo "::error::Could not resolve the head SHA of pull request #$PR_NUMBER."
            exit 1
          fi
          # head.repo is null when the fork was deleted; typecheck_diff skips
          # on an empty head_repo instead of failing this required job.
          if [ "$head_repo" = "null" ]; then
            head_repo=""
          fi
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "head_repo=$head_repo" >> "$GITHUB_OUTPUT"
          if ! branches="$(gh api --paginate \
              "repos/$REPO/branches?protected=true&per_page=100" \
              --jq '.[].name')"; then
            echo "::error::Could not determine whether '$base_ref' is protected."
            exit 1
          fi
          if ! grep -Fxq -- "$base_ref" <<<"$branches"; then
            echo "Base branch '$base_ref' is not protected; the label gate is off."
            echo "protected=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Base branch '$base_ref' is protected; the label gate applies."
          echo "protected=true" >> "$GITHUB_OUTPUT"

          for blocking in 'do not merge' 'qa in progress' 'qa failed'; do
            if grep -Fxq -- "$blocking" <<<"$labels"; then
              echo "blocking=$blocking" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          if grep -Fxq -- 'qa passed' <<<"$labels"; then
            echo "Merge approved by label."
            echo "approved=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 'qa not required' is not trusted on sight: the automatic copy caches
          # a predicate over the changed files and the pull request's author and
          # head repository, so a push can outdate it, and it may not exist yet.
          # The script honours the label only when a person applied it;
          # scripts/sync_pr_labels.py carries why a re-run cannot repair either.
          if ! approved="$(python3 scripts/sync_pr_labels.py \
              --owner "$OWNER" \
              --repo "$REPO_NAME" \
              --pr-number "$PR_NUMBER" \
              --print-eligibility)"; then
            echo "::error::Could not decide whether this pull request may skip QA."
            exit 1
          fi
          echo "May skip QA (automatic predicate or hand-applied 'qa not required'): $approved"
          echo "approved=$approved" >> "$GITHUB_OUTPUT"

      - name: Block merge on disqualifying labels
        if: steps.verdict.outputs.blocking != ''
        run: |
          echo "::error::PR is blocked by the '${{ steps.verdict.outputs.blocking }}' label. Remove 'do not merge', 'qa in progress', or 'qa failed' to proceed."
          exit 1

      - name: Require QA approval label
        if: >-
          steps.verdict.outputs.protected == 'true' &&
          steps.verdict.outputs.approved != 'true'
        run: |
          echo "::error::PR requires 'qa passed', or 'qa not required' applied by a person, to merge."
          exit 1

  # Detect changed file types to gate downstream jobs.
  # Python/frontend patterns mirror .github/labeler.yml; CI also tracks
  # .pre-commit-config.yaml separately to trigger precommit-python / precommit-frontend.
  changes:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      precommit: ${{ steps.filter.outputs.precommit }}
      frontend: ${{ steps.filter.outputs.frontend }}
      shell: ${{ steps.filter.outputs.shell }}
      sidecar: ${{ steps.filter.outputs.sidecar }}
      pipeline: ${{ steps.filter.outputs.pipeline }}
    steps:
      # Checkout uses the live PR merge ref (not replayed GITHUB_SHA) so a
      # retarget re-run checks the current base; no PR number → github.sha.
      # paths-filter omits `base:` and uses the PR Files API (current base),
      # same live source as label-gate's base_sha — see label-gate outputs.
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}

      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            python:
              - '**/**.py'
              # Nomad payloads are extensionless, so they match no *.py glob and
              # would otherwise skip the pytest tier that guards their invariants.
              - 'app/extensions/apps/**/*payload'
              - 'pyproject.toml'
              - 'alembic.ini'
              - 'poetry.lock'
              - 'poetry.toml'
              - 'settings.yaml'
              - 'sidecar/settings.yaml'
              - 'sidecar/settings-env.sh'
              - 'sidecar/supervisord.conf'
              - 'sidecar/healthcheck.sh'
              - 'sidecar/entrypoint.sh'
              - 'sidecar/wait_for_schema.sh'
              - 'sidecar/clear_sentinels.sh'
              - 'sidecar/Containerfile.sidecar'
              - 'Makefile'
              - 'frontend/packages/api/specs/**'
              # The snippet front-matter authoring rules are enforced by a
              # pytest module, and the shell filter below drives only
              # shellcheck/shfmt, so a snippet-only change would otherwise
              # skip the tier that checks it.
              - 'snippets/**'
              - '.github/labeler.yml'
              - '.github/workflows/ci.yml'
              # A skipped job counts as green in ci-success, so omitting the
              # reusable workflow would let a PR editing only it merge unrun.
              - '.github/workflows/python.yaml'
              # The core-approval drift test compares these two.
              - '.github/core-approval-paths'
              - '.github/CODEOWNERS'
            precommit:
              - '.pre-commit-config.yaml'
              - '.github/workflows/ci.yml'
            shell:
              - '**/*.sh'
            frontend:
              - 'frontend/**'
              - 'package.json'
              - '.github/actions/setup-frontend-job/**'
            sidecar:
              - 'sidecar/**'
              - 'Containerfile.base'
              - 'alembic.ini'
              - 'Makefile'
              - 'app/**'
              - 'snippets/**'
              - 'pyproject.toml'
              - 'poetry.lock'
            pipeline:
              - 'build/**/*.pipeline'
              - 'scripts/lint_pipelines.groovy'

  precommit-light:
    if: ${{ github.event.pull_request.draft == false }}
    needs:
      - label-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@28f2168f4d98ee0445e3c6321f6e6616c83dd5ec # v6.2.0
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.5.1

      - name: Cache pre-commit hook environments
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Write lightweight pre-commit config
        run: |
          cat > .pre-commit-light-config.yaml <<'EOF'
          repos:
            - repo: https://github.com/pre-commit/pre-commit-hooks
              rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b
              hooks:
                - id: check-yaml
                - id: check-json
                - id: check-toml
                - id: check-merge-conflict
                - id: check-case-conflict
                - id: check-added-large-files
                - id: end-of-file-fixer
                - id: trailing-whitespace
                - id: fix-byte-order-marker
          EOF

      - name: Perform lightweight pre-commit checks
        run: |
          pre-commit run --config .pre-commit-light-config.yaml --all-files

  precommit-python:
    if: >-
      ${{
        github.event.pull_request.draft == false &&
        (
          needs.changes.outputs.python == 'true' ||
          needs.changes.outputs.precommit == 'true' ||
          needs.changes.outputs.sidecar == 'true' ||
          needs.changes.outputs.frontend == 'true' ||
          needs.changes.outputs.shell == 'true'
        )
      }}
    needs:
      - label-gate
      - changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@28f2168f4d98ee0445e3c6321f6e6616c83dd5ec # v6.2.0
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.5.1

      - name: Cache pre-commit hook environments
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Perform Python and system pre-commit checks
        env:
          SKIP: oxfmt,oxlint
        run: pre-commit run --all-files

  precommit-frontend:
    if: >-
      ${{
        github.event.pull_request.draft == false &&
        (
          needs.changes.outputs.frontend == 'true' ||
          needs.changes.outputs.precommit == 'true'
        )
      }}
    needs:
      - label-gate
      - changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}

      - name: Setup frontend job
        uses: ./.github/actions/setup-frontend-job

      - name: Run oxfmt
        run: pnpm run format:check
        working-directory: frontend

      - name: Run oxlint
        run: pnpm run lint
        working-directory: frontend

  python:
    # `lint-fmt-only`: precommit-python already re-runs the bumped linters.
    if: >-
      ${{
        github.event.pull_request.draft == false &&
        needs.changes.outputs.python == 'true' &&
        !contains(github.event.pull_request.labels.*.name, 'lint-fmt-only')
      }}
    uses: ./.github/workflows/python.yaml
    needs:
      - label-gate
      - changes
    with:
      checkout_ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}

  # Advisory by design: intentionally omitted from `ci-success`'s `needs`. It
  # sits here rather than in python.yaml because a reusable workflow cannot make
  # one of its jobs advisory. See docs/development/ty-policy.md under `Enforcement`.
  typecheck_diff:
    # Not redundant with the draft test: on a non-pull_request event the absent
    # `pull_request` object makes `draft == false` compare 0 to 0 and pass,
    # through GitHub's numeric coercion of expression operands.
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        needs.label-gate.outputs.head_repo != '' &&
        needs.changes.outputs.python == 'true' &&
        !contains(github.event.pull_request.labels.*.name, 'lint-fmt-only')
      }}
    runs-on: ubuntu-latest
    needs:
      - label-gate
      - changes
    env:
      POETRY: poetry
    steps:
      # Checkout the live PR head, not the replayed merge commit: a re-run keeps
      # the original GITHUB_SHA (merge into the old base), so the default
      # checkout would still analyze the wrong tree against the new BASE_SHA.
      - name: Checkout PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ needs.label-gate.outputs.head_repo }}
          ref: ${{ needs.label-gate.outputs.head_sha }}
          # Full history so merge-base with the live base SHA can be computed.
          fetch-depth: 0

      - name: Ensure live base SHA is fetchable for merge-base
        env:
          BASE_SHA: ${{ needs.label-gate.outputs.base_sha }}
          # Head checkout may be a fork remote; fetch the base tip from this repo.
          # Public fetch needs no token; keep credentials off the command line.
          BASE_REPO: ${{ github.repository }}
        run: |
          git fetch --no-tags \
            "https://github.com/${BASE_REPO}.git" \
            "$BASE_SHA"

      - name: Setup Python
        uses: ./.github/actions/setup-python-job
        with:
          python-version: "3.11.9"

      # Sync explicitly: the `venv` prerequisite no-ops against the runner's
      # pre-seeded environment, and ty then resolves no third-party import —
      # here as false surplus, since an added file has no base-side counterpart.
      - name: Install dependencies
        run: poetry sync --no-root --all-extras --all-groups

      - name: Report ty diagnostics the branch adds
        env:
          # Live base from label-gate (API), not github.event — re-runs after a
          # base retarget must not diff against the original event's base SHA.
          BASE_SHA: ${{ needs.label-gate.outputs.base_sha }}
        run: make typecheck-diff

  frontend:
    if: >-
      ${{
        github.event.pull_request.draft == false &&
        needs.changes.outputs.frontend == 'true' &&
        !contains(github.event.pull_request.labels.*.name, 'lint-fmt-only')
      }}
    uses: ./.github/workflows/frontend.yaml
    needs:
      - label-gate
      - changes
    with:
      checkout_ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}

  build:
    # Runs concurrently with the python tests — the docker image build
    # consumes no test output, so it no longer gates on `python`. It starts as
    # soon as label-gate and changes succeed, while tests are still running.
    # Merge correctness is preserved by ci-success below, which
    # aggregates python, frontend, and build.
    # `lint-fmt-only`: audit-group deps not in the production image.
    if: >-
      ${{
        github.event.pull_request.draft == false &&
        needs.label-gate.result == 'success' &&
        needs.changes.result == 'success' &&
        needs.changes.outputs.sidecar == 'true' &&
        !contains(github.event.pull_request.labels.*.name, 'lint-fmt-only')
      }}
    runs-on: ubuntu-latest
    needs:
      - label-gate
      - changes
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@a0c73a10bb6782f082cd6714666c87911e4fc7d3 # v4.0.0

      - name: Build base image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Containerfile.base
          tags: extensions:builder
          load: true
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

      - name: Prepare app bundle
        run: make pack

      - name: Build app image
        run: >-
          docker build
          --build-context "localhost/extensions:builder=docker-image://extensions:builder"
          -f sidecar/Containerfile.sidecar
          --build-arg EXTENSIONS_RESTRICT_APPS=1
          -t "extensions:HEAD" .

      - name: Smoke test - verify binaries and config files
        run: |
          docker run --rm --entrypoint /bin/sh "extensions:HEAD" -c '
            set -e
            command -v valkey-server
            command -v valkey-cli
            command -v supervisord
            test -f /home/extensions/app/supervisord.conf
            test -f /home/extensions/app/healthcheck.sh
            test -x /home/extensions/app/entrypoint.sh
            test -x /home/extensions/app/wait_for_schema.sh
            test -x /home/extensions/app/clear_sentinels.sh
            test -f /home/extensions/app/settings-env.sh
            test -f /home/extensions/app/settings.yaml
          '

      - name: Smoke test - verify HEALTHCHECK instruction
        run: |
          healthcheck_test=$(docker inspect --format='{{json .Config.Healthcheck.Test}}' "extensions:HEAD")
          if [ -z "$healthcheck_test" ] || [ "$healthcheck_test" = "null" ] || [ "$healthcheck_test" = "[\"NONE\"]" ]; then
            echo "::error::HEALTHCHECK instruction is missing or disabled (HEALTHCHECK NONE) in the side-car image"
            exit 1
          fi
          healthcheck=$(docker inspect --format='{{json .Config.Healthcheck}}' "extensions:HEAD")
          echo "HEALTHCHECK present: $healthcheck"

      - name: Smoke test - verify ENTRYPOINT is the side-car wrapper
        run: |
          entrypoint=$(docker inspect --format='{{json .Config.Entrypoint}}' "extensions:HEAD")
          case "$entrypoint" in
            *entrypoint.sh*) ;;
            *)
              echo "::error::ENTRYPOINT is not the side-car wrapper, so the broker credential is never minted: $entrypoint"
              exit 1
              ;;
          esac
          echo "ENTRYPOINT present: $entrypoint"

      - name: Smoke test - restricted image ships exactly the activated apps
        run: sidecar/verify_image_apps.sh "extensions:HEAD" restricted

      - name: Verify the purge layer is the last package-manager operation
        run: python3 scripts/check_sidecar_purge.py --check-ordering

      - name: Smoke test - purged packages are absent from the built image
        run: |
          pkgs="$(python3 scripts/check_sidecar_purge.py --print-packages | tr '\n' ' ')"
          if [ -z "$pkgs" ]; then
            echo "::error::the purge checker named no packages, so this check cannot run"
            exit 1
          fi
          docker run --rm --entrypoint /bin/sh -e PURGED="$pkgs" "extensions:HEAD" -c '
            command -v dpkg-query > /dev/null 2>&1 || {
              echo "::error::dpkg-query is absent, so package presence cannot be established"
              exit 1
            }
            status=0
            for p in $PURGED; do
              if dpkg-query -s "$p" 2>/dev/null | grep -q "^Status: install ok installed"; then
                echo "::error::$p is still installed in the built image"
                status=1
              fi
            done
            if command -v perl > /dev/null 2>&1; then
              echo "::error::a perl binary resolves on PATH"
              status=1
            fi
            exit $status
          '

  pipeline-syntax:
    if: >-
      ${{
        github.event.pull_request.draft == false &&
        needs.changes.outputs.pipeline == 'true'
      }}
    needs:
      - label-gate
      - changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}

      - name: Parse Jenkins pipeline Groovy syntax
        run: |
          pipelines=()
          while IFS= read -r pipeline; do
            pipelines+=("$pipeline")
          done < <(git ls-files -- ':(glob)build/**/*.pipeline')
          ((${#pipelines[@]})) || {
            echo "::error::No build/**/*.pipeline files found."
            exit 1
          }
          docker run --rm -v "$PWD:/w" -w /w \
            groovy@sha256:fcfaaa9eba20ccc3b438a70cb599e721996758ecf22de70dc0a85302c97822aa \
            groovy scripts/lint_pipelines.groovy \
            "${pipelines[@]}"

  ci-success:
    if: always()
    needs:
      - label-gate
      - changes
      - precommit-light
      - precommit-python
      - precommit-frontend
      - python
      - frontend
      - build
      - pipeline-syntax
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
