# Main CI workflow

name: Python

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: >-
          Live PR merge ref (refs/pull/N/merge) so a CI re-run after base
          retarget does not keep testing the replayed GITHUB_SHA. Empty falls
          back to github.sha (workflow_dispatch / no caller ref).
        type: string
        required: false
        default: ''
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  POETRY: poetry

jobs:
  bandit:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.11.9"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Setup Python
        uses: ./.github/actions/setup-python-job
        with:
          python-version: ${{ matrix.python }}
      - name: Run bandit
        run: make bandit

  typecheck:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.11.9"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Setup Python
        uses: ./.github/actions/setup-python-job
        with:
          python-version: ${{ matrix.python }}
          cache: poetry
      # Sync explicitly: the `venv` prerequisite no-ops against the runner's
      # pre-seeded environment, and ty resolves imports against what is actually
      # installed. See docs/development/ty-policy.md under `Enforcement`.
      - name: Install dependencies
        run: poetry sync --no-root --all-extras --all-groups
      - name: Hold error-severity diagnostics at zero
        run: make typecheck

  lock_check:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.11.9"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Setup Python
        uses: ./.github/actions/setup-python-job
        with:
          python-version: ${{ matrix.python }}
      - name: Check pyproject.toml/poetry.lock consistency
        run: poetry check --lock --strict

  check_migrations:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.11.9"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Setup Python
        uses: ./.github/actions/setup-python-job
        with:
          python-version: ${{ matrix.python }}
      # ENCRYPTION_KEY is required to construct settings and is minted per run
      # rather than stored: migrations encrypt nothing, so the value only has to
      # be a valid key, and nothing here needs it to outlive the job.
      - name: Check migrations
        run: AUTH__PROVIDER__CASDOOR__CLIENT_SECRET=notatoken AUTH__PROVIDER__CASDOOR__CLIENT_ID=notatoken ENCRYPTION_KEY="$(make -s encryption-key)" make checkmigrations

  test:
    name: test (${{ matrix.group }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pytest-split balances the shards with the per-test durations in
        # .test_durations. Refresh that file from the `test-durations` artifact
        # of a recent Coverage (main) run.
        group: [1, 2, 3]
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Setup Python 3.9 for the host-payload compatibility guard
        id: py39
        uses: actions/setup-python@28f2168f4d98ee0445e3c6321f6e6616c83dd5ec # v6.2.0
        with:
          python-version: "3.9"
      - name: Setup Python
        uses: ./.github/actions/setup-python-job
        with:
          python-version: "3.11.9"
          cache: poetry
      - name: Install test dependencies
        run: poetry sync --no-root
      - name: Install the shells the seed tests execute under
        # tests/app/tasks/db/test_seed.py runs every seeded shell body under
        # dash, busybox sh and bash, skipping any that is absent. The runner's
        # preinstalled busybox-static prefers its own applets over PATH, so the
        # distribution busybox package replaces it.
        run: sudo apt-get update && sudo apt-get install -y dash busybox
      - name: Run tests
        env:
          EXTENSIONS_PAYLOAD_CHECK_PYTHON: ${{ steps.py39.outputs.python-path }}
          COVERAGE_FILE: .coverage.${{ matrix.group }}
        # One shard's coverage falls short of fail_under on its own, so the
        # gate and the report run on the merged data in the coverage job.
        run: >-
          make test PYTEST_MARKERS='not postgres' COV=1
          PYTEST_ARGS='--splits ${{ strategy.job-total }} --group ${{ matrix.group }}
          --cov-report= --cov-fail-under=0'
      - name: Scaffold conformance check
        if: matrix.group == 1
        run: make startapp-check
      - name: Upload coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-${{ matrix.group }}
          path: .coverage.${{ matrix.group }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  coverage:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Setup Python
        uses: ./.github/actions/setup-python-job
        with:
          python-version: "3.11.9"
          cache: poetry
      - name: Install dependencies
        run: poetry sync --no-root
      - name: Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-*
          merge-multiple: true
      - name: Combine coverage and enforce fail_under
        run: poetry run coverage combine && poetry run coverage report
      - name: Generate coverage comment data
        id: coverage_comment
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@63f52f4fbbffada6e8dee8ec432de7e01df9ba79 # v3.41
        with:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload coverage comment artifact
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt

  test_postgres:
    name: test (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: extensions
          POSTGRES_PASSWORD: extensions
          POSTGRES_DB: extensions_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      EXTENSIONS_TEST_POSTGRES_DSN: postgresql+asyncpg://extensions:extensions@localhost:5432/extensions_test
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Setup Python
        uses: ./.github/actions/setup-python-job
        with:
          python-version: "3.11.9"
          cache: poetry
      - name: Install test dependencies
        run: poetry sync --no-root --with postgresql
      - name: Run PostgreSQL tests
        run: make test PYTEST_MARKERS='postgres' PYTEST_WORKERS=0 COV=0

  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.11.9"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Setup Python
        uses: ./.github/actions/setup-python-job
        with:
          python-version: ${{ matrix.python }}
      - name: Build package
        run: make build
