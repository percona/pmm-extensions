# Store main-branch coverage data so PR coverage comments can display
# evolution (old% -> new%). The py-cov-action commits coverage JSON to
# the python-coverage-comment-action-data branch on pushes to main, and
# subsequent PR runs read from it to compute the delta.

name: Coverage (main)

on:
  push:
    branches:
    - main

permissions:
  contents: read

env:
  POETRY: poetry

jobs:
  store-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python 3.9 for the host-payload compatibility guard
        id: py39
        uses: actions/setup-python@28f2168f4d98ee0445e3c6321f6e6616c83dd5ec # v6.2.0
        with:
          python-version: "3.9"

      - name: Setup Python
        uses: ./.github/actions/setup-python-job
        with:
          python-version: "3.11.9"
          cache: poetry

      - name: Install test dependencies
        run: poetry sync --no-root

      - name: Install the shells the seed tests execute under
        # See the matching step in python.yaml.
        run: sudo apt-get update && sudo apt-get install -y dash busybox

      - name: Run tests
        env:
          EXTENSIONS_PAYLOAD_CHECK_PYTHON: ${{ steps.py39.outputs.python-path }}
        run: make test

      - name: Store coverage data on data branch
        uses: py-cov-action/python-coverage-comment-action@63f52f4fbbffada6e8dee8ec432de7e01df9ba79 # v3.41
        with:
          GITHUB_TOKEN: ${{ github.token }}
