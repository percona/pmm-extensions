# Re-run CI when an open PR's base branch changes (hand retarget).
# Keeps gate logic in ci.yml; does not add `edited` there (SEP-2092 / SEP-2071).
#
# SECURITY: pull_request_target + actions: write is safe only while this workflow
# checks out nothing and executes no pull-request code. Do not add
# actions/checkout or run scripts from the PR head. The job below asserts the
# workspace has no git checkout before it proceeds.
name: Re-run CI on base change

on:
  pull_request_target:
    types: [edited]

permissions:
  actions: write
  checks: write
  contents: read
  pull-requests: read

jobs:
  rerun-ci:
    if: github.event.changes.base != null
    runs-on: ubuntu-latest
    steps:
      - name: Re-run latest CI for this PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          # Guard: a later edit that checks out the PR would turn actions: write
          # into a privilege escalation under pull_request_target.
          if [ -d "$GITHUB_WORKSPACE/.git" ]; then
            echo "::error::Refusing to run with a checked-out repository under pull_request_target + actions:write. Remove any checkout from this workflow."
            exit 1
          fi

          # Fail-closed: this helper is not itself a required check. When CI
          # cannot be re-run (e.g. GitHub's 30-day re-run window), post a
          # failing ci-success on the head SHA so a stale green check cannot
          # satisfy the merge gate without a QA re-evaluation.
          fail_closed_ci_success() {
            # Avoid re-entering via the ERR trap when we exit 1 below.
            trap - ERR
            local reason="$1"
            echo "::error::$reason"
            gh api -X POST "repos/$REPO/check-runs" \
              -f name='ci-success' \
              -f head_sha="$head_sha" \
              -f status='completed' \
              -f conclusion='failure' \
              -f 'output[title]=Retarget could not re-run CI' \
              -f "output[summary]=${reason} Push a new commit (or close and reopen the PR) so CI runs against the new base with a full label-gate evaluation."
            exit 1
          }

          # Live head from the API: a push right after the retarget can leave
          # github.event.pull_request.head.sha pointing at a superseded commit.
          if ! pr="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"; then
            echo "::error::Could not read pull request #$PR_NUMBER."
            exit 1
          fi
          head_sha="$(jq -r '.head.sha' <<<"$pr")"
          if [ -z "$head_sha" ] || [ "$head_sha" = "null" ]; then
            echo "::error::Could not resolve head SHA of pull request #$PR_NUMBER."
            exit 1
          fi
          echo "PR #$PR_NUMBER live head $head_sha"

          # After head_sha is known, any unexpected failure under set -e
          # (run list, status polls, etc.) must still block merge: otherwise
          # only this non-required helper goes red and stale ci-success stays.
          trap 'fail_closed_ci_success "Unexpected failure after resolving head '"$head_sha"' (exit $?); QA was not re-evaluated against the new base."' ERR

          # Latest pull_request-triggered CI run for this PR + head (workflow file
          # ci.yml). Paginate: another PR sharing this head can fill the first
          # page with newer runs (e.g. label churn), which would hide ours.
          # Filter by pull_requests[].number so two open PRs that share a head
          # SHA (same branch, different bases) cannot cancel/re-run each other.
          runs="$(gh api --paginate \
            "repos/$REPO/actions/workflows/ci.yml/runs?event=pull_request&head_sha=$head_sha&per_page=100" \
            --jq '.workflow_runs[]' | jq -s '.')"
          run_json="$(jq -c --arg pr "$PR_NUMBER" '
            [.[]
              | select(any(.pull_requests[]; .number == ($pr | tonumber)))
            ][0] // empty
          ' <<<"$runs")"
          if [ -z "$run_json" ]; then
            echo "No CI run found for PR #$PR_NUMBER head $head_sha; nothing to re-run."
            exit 0
          fi

          run_id="$(jq -r '.id' <<<"$run_json")"
          status="$(jq -r '.status' <<<"$run_json")"
          echo "Found CI run $run_id (status=$status) for PR #$PR_NUMBER head $head_sha"

          # gh run rerun is refused while the run is still active. ci.yml
          # concurrency only cancels *new* runs in the group — it does not make
          # an in-progress run re-runnable, so cancel-and-wait stays required.
          if [ "$status" != "completed" ]; then
            echo "Cancelling in-flight run $run_id before re-run"
            if ! gh run cancel "$run_id" --repo "$REPO"; then
              status="$(gh api "repos/$REPO/actions/runs/$run_id" --jq '.status')"
              if [ "$status" != "completed" ]; then
                fail_closed_ci_success "Failed to cancel in-flight CI run $run_id (status=$status) after base retarget."
              fi
              echo "Run completed before cancel took effect; proceeding to re-run."
            else
              status=""
              for attempt in $(seq 1 60); do
                status="$(gh api "repos/$REPO/actions/runs/$run_id" --jq '.status')"
                if [ "$status" = "completed" ]; then
                  echo "Run $run_id completed after cancel."
                  break
                fi
                echo "Waiting for run $run_id to finish (status=$status, attempt $attempt/60)"
                sleep 10
              done
              if [ "$status" != "completed" ]; then
                fail_closed_ci_success "Timed out waiting for CI run $run_id to finish after cancel (last status=$status)."
              fi
            fi
          fi

          echo "Re-running CI run $run_id (label-gate will resolve base from the API)"
          # Brief retries cover the race where GitHub still reports the run as
          # not re-runnable for a moment after status flips to completed.
          # Permanent failures include the 30-day re-run window.
          for attempt in 1 2 3 4 5; do
            if gh run rerun "$run_id" --repo "$REPO"; then
              exit 0
            fi
            echo "gh run rerun failed (attempt $attempt/5); retrying in 5s"
            sleep 5
          done
          fail_closed_ci_success "Could not re-run CI run $run_id after base retarget (GitHub may refuse re-runs older than 30 days)."
