# Frontend quality checks (lint, typecheck, unit tests, build, E2E) for the pnpm workspace under frontend/.
# lint-typecheck, unit-test, and build run in parallel; e2e waits only on lint-typecheck as a fail-fast
# gate (not a data dependency) to avoid spending Playwright minutes on code that fails to compile.
# Merge gating is enforced by ci-success in ci.yml.

name: Frontend

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup frontend job
        uses: ./.github/actions/setup-frontend-job

      - name: Codegen freshness (OpenAPI → TS)
        run: |
          pnpm --filter @pmm-extensions/api codegen
          pnpm --filter @pmm-extensions/api exec oxfmt --write src/generated
          git diff --exit-code -- packages/api/src/generated/
          pnpm --filter @pmm-extensions/shell codegen
          pnpm --filter @pmm-extensions/shell exec oxfmt --write src/generated
          git diff --exit-code -- packages/shell/src/generated/

      - name: Lint (oxlint)
        run: pnpm lint

      - name: Typecheck (tsc --noEmit)
        run: pnpm typecheck

      - name: Unused files, exports and dependencies (knip)
        run: pnpm knip

  unit-test:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup frontend job
        uses: ./.github/actions/setup-frontend-job

      - name: Test (Vitest)
        run: pnpm test

  build:
    name: Build & Storybook
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup frontend job
        uses: ./.github/actions/setup-frontend-job

      - name: Build
        run: pnpm build

      - name: Build Storybook
        run: pnpm build-storybook

  e2e:
    name: E2E (Playwright / Chromium)
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup frontend job
        uses: ./.github/actions/setup-frontend-job

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('frontend/packages/e2e/package.json') }}
          restore-keys: playwright-

      - name: Install Playwright Chromium and system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @pmm-extensions/e2e exec playwright install chromium --with-deps

      - name: Run E2E tests
        run: pnpm --filter @pmm-extensions/e2e test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: frontend/packages/e2e/playwright-report/
          retention-days: 7
