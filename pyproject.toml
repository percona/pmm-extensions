[project]
name = "pmm-extensions"
version = "3.10.0.dev0"
description = "PMM Extensions"
authors = [
    {name = "Ceri Williams", email = "ceri.williams@percona.com"},
    {name = "Max Bubenick", email = "max.bubenick@percona.com"},
    {name = "Peter Addo", email = "peter.addo@percona.com"},
    {name = "Yan Orestes", email = "yan.orestes@percona.com"},
]
maintainers = [
    {name = "Ceri Williams", email = "ceri.williams@percona.com"},
    {name = "Max Bubenick", email = "max.bubenick@percona.com"},
    {name = "Peter Addo", email = "peter.addo@percona.com"},
    {name = "Yan Orestes", email = "yan.orestes@percona.com"},
]
readme = "README.md"
repository = "https://github.com/percona/pmm-extensions"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Framework :: MkDocs",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed"
]
requires-python = ">=3.11.9,!=3.12.0,!=3.12.1,!=3.12.2,<3.14"
dependencies = [
    "aiohttp (>=3.14.3,<4.0.0)",
    "uvicorn[standard] (>=0.32.0,<0.33.0)",
    "sqlalchemy-celery-beat (>=0.8.4,<0.9.0)",
    "aioresponses (>=0.7.7,<0.8.0)",
    "itsdangerous (>=2.1.2,<3.0.0)",
    "pydantic (>=2.13.5,<2.14.0)",
    "pyyaml (>=6.0.1,<7.0.0)",
    "python-nomad (>=2.0.0,<3.0.0)",
    "sqlalchemy (>=2.0.34,<3.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "email-validator (>=2.2.0,<3.0.0)",
    "aiosqlite (>=0.20.0,<0.21.0)",
    "alembic (>=1.13.2,<2.0.0)",
    "sqlmodel (>=0.0.42,<0.0.43)",
    "async-lru (>=2.0.4,<2.2.0)",
    "python-minifier (>=2.11.2,<3.0.0)",
    "starlette (>=1.3.1,<2.0.0)",
    "celery (>=5.6.0,<6.0.0)",
    "fastapi (>=0.136,<0.137)",
    "httpx (>=0.28.0,<0.29.0)",
    "rich (>=13.9.4,<14.0.0)",
    "pygments (>=2.20.0,<3.0.0)",
    "presidio-analyzer (>=2.2.361,<3.0.0)",
    "presidio-anonymizer (>=2.2.361,<3.0.0)",
    "aiofiles (>=24.1.0,<25.0.0)",
    "typing-extensions (>=4.15.0,<5.0.0)",
    "python-multipart (>=0.0.31,<0.0.32)",
    "weasyprint (>=70.0,<71.0)",
    "cryptography (>=50.0.0,<51.0.0)",
]

[tool.poetry]
packages = [
    { include = "app" }
]

[tool.poetry.group.audit]
optional = true

[tool.poetry.group.audit.dependencies]
pip-audit = "^2.10.0"
bandit = {extras = ["toml"], version = "^1.7.9"}
ruff = "^0.9.4"

[tool.poetry.group.typecheck]
optional = true

[tool.poetry.group.typecheck.dependencies]
# Pinned exactly: ty is beta (0.0.x), breaking changes between any two versions.
ty = "0.0.49"

[tool.poetry.group.postgresql]
optional = true

[tool.poetry.group.postgresql.dependencies]
asyncpg = "^0.31.0"

[tool.poetry.group.syncpostgresql]
optional = true

[tool.poetry.group.syncpostgresql.dependencies]
psycopg2-binary = "^2.9.12"

[tool.poetry.group.magic]
optional = true

[tool.poetry.group.magic.dependencies]
python-magic = "^0.4.27"

[tool.poetry.group.redis]
optional = true

[tool.poetry.group.redis.dependencies]
kombu = {extras = ["redis"], version = "^5.6.2"}

[tool.poetry.group.spacy_en_model_sm]
optional = true

[tool.poetry.group.spacy_en_model_sm.dependencies]
en-core-web-sm = {url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"}

[tool.poetry.group.spacy_en_model_md]
optional = true

[tool.poetry.group.spacy_en_model_md.dependencies]
en-core-web-md = {url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl"}

[tool.poetry.group.spacy_en_model_lg]
optional = true

[tool.poetry.group.spacy_en_model_lg.dependencies]
en-core-web-lg = {url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl"}

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.5.1"
pytest = "^9.0.3"
pytest-cov = "^6.0.0"
pytest-mock = "^3.14.0"
faker = "^30.8.2"
polyfactory = "^2.18.0"
pytest-asyncio = "^1.3.0"
pytest-env = "^1.1.5"
pytest-xdist = "^3.5"
pytest-timeout = "^2.3.1"
pymysql = "^1.1.3"
myloginpath = "^0.0.4"
mutmut = "^3.6.0"
vermin = "^1.8.0"

[tool.poetry.requires-plugins]
poetry-plugin-export = "^1.9.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.bandit]
exclude_dirs = [
    ".git",
    ".github",
    "build",
    "venv",
    "app/tests/",
    "app/extensions/apps/dipper/payloads/",
    "app/extensions/sync/syncers/system_facts/payload.py",  # host-run payload; reads packages via rpm/dpkg-query (literal argv)
]

[tool.ty.environment]
# Target the project's minimum supported Python minor version (matches ruff target-version = "py311").
python-version = "3.11"
[tool.ty.src]
# The checked surface is defined here rather than by a path argument, so that this
# list and `make typecheck` cannot drift apart: the target passes no path arguments.
# See docs/development/ty-policy.md.
include = [
    "app",
    "tests",
    "scripts",
    "sidecar",
]
# Exclude generated / non-checkable trees. Alembic migrations live under app/*/migrations/.
exclude = [
    "**/migrations/**",
    "frontend/**",
]

[tool.ty.rules]
# Severity policy. Rationale, hit counts and per-rule justification live in
# docs/development/ty-policy.md, which is where the measurements are kept; a
# trailing comment here carries only a reason the rule name and its severity do
# not already give. An unlisted rule is an error, so a rule that starts firing
# after a code change or a ty upgrade arrives loud by design.
all = "error"

# Softened to `warn`: sampling found each of these mixes genuine defects with
# artifacts of how a dependency is typed, so neither `error` nor `ignore` is
# honest while those stubs are unshimmed. `warn` still prints every diagnostic.
invalid-argument-type = "warn"       # the sqlmodel/sqlalchemy AsyncSession split, mixed with genuine `int` vs `int | None`
unresolved-attribute = "warn"        # genuine Optional narrowing, mixed with test doubles and third-party stub gaps
unknown-argument = "warn"            # dominated by pydantic-settings `_env_file` / `_secrets_dir` constructor kwargs
invalid-assignment = "warn"          # largely the pydantic `Field(...)` -> FieldInfo idiom
missing-argument = "warn"            # `Settings()` fills its required fields from the environment, invisibly to ty
call-non-callable = "warn"           # subscripted generics and `object`-typed fixtures, mixed with real `None` calls
no-matching-overload = "warn"        # third-party overload sets: `AsyncSession.exec`, `select`, `create_model`
unresolved-import = "warn"           # mostly golden-app templates scaffolded at test time
invalid-parameter-default = "warn"   # mostly the FastAPI `Query(...)` default idiom

# Confirmed at `error`: predominantly first-party annotation defects with a fix
# available in this repository.
invalid-return-type = "error"        # nullable returns, generator fixtures annotated as the yielded type
not-subscriptable = "error"          # mostly subscripting a value ty knows may be `None`
invalid-type-form = "error"          # PMM Extensions' own dynamic `type[BaseUser]` / `type[BaseModel]` annotations
unsupported-operator = "error"       # mostly an un-narrowed `X | None` operand; the rest widen an operand to `object`
invalid-method-override = "error"    # first-party overrides of first-party bases
not-iterable = "error"               # includes `async for` over a coroutine that was never awaited
call-top-callable = "error"          # `callable()` narrowing drops the signature; fixable by annotating the attribute
unbound-type-variable = "error"      # first-party: the app/core generics
invalid-paramspec = "error"          # `*args: P.args` without the matching `**kwargs: P.kwargs`
invalid-context-manager = "error"    # an `__aexit__` signature that prevents `async with`
empty-body = "error"                 # implicit `None` return against a non-`None` annotation
redundant-cast = "error"
possibly-missing-submodule = "error" # submodule referenced without being imported
mismatched-type-name = "error"       # `StrEnum` name does not match the variable it is assigned to
invalid-yield = "error"              # the yielded value is optional, the annotation is not
invalid-key = "error"
invalid-base = "error"
invalid-attribute-access = "error"   # assignment to a `ClassVar` through an instance
deprecated = "error"                 # the deprecation is the library's own, so the fix is at our call site

# ty ships these five disabled by default, so `all = "error"` is what switches
# them on. The three kept are latent-bug detectors. The two dropped are
# annotation and style conventions this project has not adopted, and neither was
# reported before this table existed, so ignoring them loses no signal that was
# previously available.
possibly-unresolved-reference = "error"
possibly-missing-attribute = "error"    # attribute read through a partially-narrowed union
unsupported-dynamic-base = "error"      # class base computed at runtime, so the hierarchy is unknown
missing-type-argument = "ignore"        # bare generics are widespread and intended; parameterizing them all is its own decision
missing-override-decorator = "ignore"   # PEP 698 `@override` is not a convention this project has adopted

# Dependency-typing artifacts, neutralized per (file, rule). Every hit of the
# named rule in the named files is a shape ty reports because of how a dependency
# is typed, not a defect here; `scripts/classify_ty_diagnostics.py` carries the
# discriminant that establishes that, and `check` mode proves no first-party
# diagnostic was suppressed alongside. Files where the rule also reports genuine
# defects are absent here and take per-site `# ty: ignore[rule]` comments
# instead, because an override cannot discriminate within a file. Groups, counts
# and the residual baseline: docs/development/ty-policy.md.

[[tool.ty.overrides]]
# `Settings` subclasses reach the proxy-installed `_set_snapshot` / `get_snapshot`
# / `_setting_class` helpers, which the generated model class does not declare.
include = [
    "tests/app/conftest.py",
    "tests/app/core/alerts/test_config.py",
    "tests/app/core/settings_override/test_lifecycle.py",
    "tests/app/extensions/api/routes/test_settings.py",
    "tests/app/extensions/api/routes/test_settings_export.py",
    "tests/app/extensions/apps/alerts/test_config.py",
    "tests/app/extensions/apps/report/test_config.py",
    "tests/app/extensions/routes/test_stream_logs.py",
    "tests/app/tasks/test_celery_settings_override.py",
]
[tool.ty.overrides.rules]
unresolved-attribute = "ignore"

[[tool.ty.overrides]]
# `Celery` installs `loop` and the other attributes read here at runtime, so the
# stub declares none of them.
include = [
    "app/extensions/apps/alerts/celery.py",
    "app/extensions/apps/atw/celery.py",
    "app/extensions/apps/om_inventory/celery.py",
    "app/extensions/apps/report/celery.py",
    "app/extensions/settings_override.py",
    "tests/app/extensions/test_app_drain.py",
]
[tool.ty.overrides.rules]
unresolved-attribute = "ignore"

[[tool.ty.overrides]]
# A `Field(...)` default is a `FieldInfo` until pydantic builds the model, so ty
# sees the declared field type assigned a `FieldInfo`.
include = [
    "tests/app/core/settings_override/api/test_registry_helpers.py",
    "tests/app/core/settings_override/test_registry.py",
    "tests/app/core/settings_override/test_resolution.py",
    "tests/app/core/settings_override/test_secret_preservation.py",
    "tests/app/extensions/test_settings_override_worker.py",
]
[tool.ty.overrides.rules]
invalid-assignment = "ignore"

[[tool.ty.overrides]]
# `Settings()` fills `CELERY` from the environment and `_session` is injected, so
# neither is passed at the call site ty inspects.
include = [
    "app/core/config.py",
    "tests/app/core/celery/test_config.py",
    "tests/app/core/settings_override/test_policy.py",
    "tests/app/core/test_config.py",
    "tests/app/extensions/sync/syncers/system_facts/test_syncer.py",
    "tests/app/extensions/sync/syncers/test_pmm.py",
    "tests/app/extensions/sync/test_models.py",
    "tests/sidecar/test_embedded_settings.py",
    "tests/sidecar/test_settings_env.py",
]
[tool.ty.overrides.rules]
missing-argument = "ignore"

[[tool.ty.overrides]]
# pydantic-settings accepts `_env_file` / `_secrets_dir` and their siblings at
# runtime, but they are absent from the generated `__init__`.
# `tests/app/extensions/test_config.py` is not listed: it also passes a first-party
# `PMM` kwarg, so its artifacts take per-site comments.
include = [
    "app/core/config.py",
    "tests/app/core/auth/test_config.py",
    "tests/app/core/celery/test_config.py",
    "tests/app/core/test_config.py",
    "tests/app/extensions/apps/alerts/test_config.py",
    "tests/app/extensions/apps/report/test_config.py",
    "tests/sidecar/test_embedded_settings.py",
    "tests/sidecar/test_settings_env.py",
]
[tool.ty.overrides.rules]
unknown-argument = "ignore"

[[tool.ty.overrides]]
# `AsyncSession.exec`, `select` and `create_model` are third-party overload sets
# ty cannot resolve against these call sites.
include = [
    "app/core/db/crud.py",
    "app/extensions/apps/om_inventory/crud.py",
    "app/extensions/apps/framework/responses.py",
    "app/extensions/snippets/models/snippet.py",
    "tests/app/core/db/test_utils.py",
    "tests/app/inventory/test_crud.py",
    "tests/app/extensions/apps/framework/test_rules.py",
    "tests/app/extensions/apps/framework/test_script_source.py",
    "tests/app/test_db_schema.py",
]
[tool.ty.overrides.rules]
no-matching-overload = "ignore"

[[tool.ty.overrides]]
# `sa_type=` is given a `TypeDecorator` *instance*, which is what SQLAlchemy wants
# and what the sqlmodel stub's `type[Any]` annotation rejects.
include = [
    "app/core/db/models.py",
    "app/inventory/models.py",
    "app/extensions/apps/atw/models.py",
    "app/extensions/apps/mysql_backups/models.py",
    "app/extensions/apps/om_bootstrap/models.py",
    "app/extensions/apps/om_inventory/models.py",
]
[tool.ty.overrides.rules]
invalid-argument-type = "ignore"

[[tool.ty.overrides]]
# Subscripted generics are callable at runtime; ty sees the `GenericAlias`.
include = [
    "app/extensions/config.py",
    "tests/app/core/test_requests.py",
    "tests/app/extensions/apps/inventory/test_deps.py",
]
[tool.ty.overrides.rules]
call-non-callable = "ignore"

[[tool.ty.overrides]]
# A FastAPI `Query(...)` marker stands in for the parameter's declared type until
# the request is handled.
include = [
    "app/core/db/list_query.py",
    "app/extensions/apps/inventory/list_query.py",
]
[tool.ty.overrides.rules]
invalid-parameter-default = "ignore"

[[tool.ty.overrides]]
# The imported modules do not exist at check time: the `app.extensions.apps.golden_*`
# targets are scaffolded by the test run, and payload.py runs on the monitored
# host, which is also why [tool.bandit] carves it out above. Scoped to
# `unresolved-import` rather than excluding the files, because they carry
# first-party diagnostics under other rules.
include = [
    "app/extensions/apps/om_inventory/payload/probe.py",
    "app/extensions/sync/syncers/system_facts/payload.py",
    "tests/app/extensions/apps/framework/golden/base/app.py",
    "tests/app/extensions/apps/framework/golden/script/app.py",
    "tests/app/extensions/apps/framework/golden/task/app.py",
    "tests/app/extensions/apps/framework/golden/task/spec.py",
]
[tool.ty.overrides.rules]
unresolved-import = "ignore"

[[tool.ty.overrides]]
# `pygments.lexers` re-exports its lexers lazily through `__getattr__`, so the
# stub lists no `TextLexer` member.
include = [
    "app/extensions/utils/jinja.py",
    "tests/app/extensions/utils/test_jinja.py",
]
[tool.ty.overrides.rules]
unresolved-import = "ignore"

[tool.ruff]
fix = true
show-fixes = true
extend-exclude = [
    ".github",
    "build",
    "data",
    "/docs",
    "etc",
    "app/*/migrations/*",
    "payload.py",
    "payload",
    "*_payload",
    "**/payloads/*",
    "tests/app/extensions/apps/framework/golden/**",
]
cache-dir = "build/tmp/.ruff_cache"
target-version = "py311"
force-exclude = true

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "C90",
    "I",
    "N",
    "D",
    "UP",
    "ANN0",
    "ANN2",
    "ASYNC",
    "S",
    "BLE001",
    "FBT",
    "B",
    "A",
    "COM818",
    "C4",
    "DTZ",
    "T100",
    "EXE",
    "ISC",
    "ICN001",
    "LOG",
    "G",
    "INP001",
    "PIE",
    "T20",
    "PT",
    "Q",
    "RSE102",
    "RET",
    "SLF001",
    "SIM",
    "TID252",
    "TC",
    "ARG",
    "PTH",
    "TD",
    "FIX",
    "ERA001",
    "PGH",
    "PL",
    "TRY",
    "FLY002",
    "PERF",
    "FURB",
    "RUF",
]
ignore = [
    "E501",
    "D104",
    "D105",
    "D106",
    "D107",
    "D203",
    "D213",
    "ISC001",
    "TC001",
    "FIX002",
    "TRY003",
    "RUF007",
    "RUF012", # Too much false positives with Pydantic subclasses (https://github.com/astral-sh/ruff/issues/5639)
    "PLR0913",
]
task-tags = ["TODO"]

[tool.ruff.lint.isort]
order-by-type = false

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "sqlmodel.SQLModel",
    "app.core.db.models.BaseSQLModel",
    "app.core.db.models.BaseUUIDSQLModel",
]

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"sqlalchemy.Enum" = "EnumField"
"sqlmodel.Field" = "SQLField"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"config.py" = [
    "N802",
]
"app/core/config.py" = ["ARG003"]
"app/core/utils/fields.py" = ["TRY004"] # Pydantic validation code should raise ValueError
"celery.py" = ["ARG001"]
"test_*.py" = ["S", "ARG001", "ARG002", "ANN", "SLF001"]
"conftest.py" = ["S", "ARG001", "ARG002"]
"tests/app/extensions/apps/framework/contract_suite.py" = ["S"] # pytest contract-suite mixin uses bare assert
"tests/app/extensions/apps/mysql_backups/description_coverage.py" = ["S"] # shared pytest assertion helper uses bare assert
"scripts/*.py" = [
    "T201", # CLI scripts use print() for user-facing output
    "S603", # CLI scripts coordinate git/gh/make subprocesses with literal arg lists
]
"sidecar/verify_image_apps.py" = [
    "T201", # the verdict line is the gate's only non-silent success signal
]
"app/extensions/apps/framework/form_audit.py" = [
    "T201", # the audit's report is its output, so it goes to stdout, not the log
]
"app/extensions/apps/backup_mongo/pbm_creds_common.py" = [
    "T201",   # canonical payload preamble prints diagnostics to stderr (as the shipped payloads do)
    "PTH123", # payload preamble uses builtin open(), as the shipped payloads do
    "BLE001", # payload preamble mirrors a deliberate catch-all credentials-read guard
]
"app/extensions/sync/syncers/system_facts/payload.py" = [
    "S603", # host-run payload coordinates rpm/dpkg-query with literal arg lists
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
# Guardrail: fail a runaway per-test setup/call/teardown instead of blocking the
# whole run forever. Uses thread method so xdist workers stay compatible.
timeout = 120
timeout_method = "thread"
markers = [
    "postgres: require a real PostgreSQL service (EXTENSIONS_TEST_POSTGRES_DSN)",
]
# A developer dotenv file must never reach the suite: CI runs with no .env, so
# any setting it carries makes the local run a weaker experiment than CI. This
# pin points PreEnvSettings.ENV_FILE at a committed dotenv file with no
# assignments, so pytest ignores contributor-local dotenv files (exported env
# vars can still override as usual).
env = [
    "ENV_FILE=tests/pytest.env",
    "AUTH__PROVIDER__CASDOOR__CLIENT_ID=test-client-id",
    "AUTH__PROVIDER__CASDOOR__CLIENT_SECRET=test-client-secret",
    'AUTH__PROVIDER__CASDOOR__ALLOWED_ISSUERS=["https://allowed-issuer.com"]',
    'ALLOWED_HOSTS=["testserver", "test"]',
    "EXTENSIONS__MESSAGES__LEVEL=0",
    "ALLOW_CONCURRENT_SESSIONS=false",
    "EXTENSIONS_INTERNAL_TOKEN=test-internal-token"
]

[tool.coverage.run]
relative_files = true
branch = true
source = ["app"]
omit = [
    "__init__.py",
    # Apps the scaffolder tests generate under the real source tree and delete
    # in teardown: measuring them leaves dead source paths in .coverage that
    # break `coverage json` (the PR coverage-comment step) with "No source for code".
    "app/extensions/apps/_scaffold_*/*",
    # Payload scripts: uploaded as file:// URIs and executed on the target host,
    # never imported in-process. They enter the report only because the AST
    # harness execs extracted symbols under the payload's path, so their line
    # coverage measures harness mechanics rather than the suite's reach.
    "app/extensions/apps/*/payload",
    "app/extensions/apps/*/*_payload",
    "app/extensions/apps/*/*/*_payload",
    "app/extensions/apps/*/payloads/*",
    "app/extensions/apps/alters/pre_checks.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 85

# Optional mutation-testing pilot. Not wired into make test / CI.
# Mutmut runs pytest from a mutants/ sandbox copy; also_copy pulls the config
# the suite needs when loading app settings.
[tool.mutmut]
source_paths = ["app/"]
only_mutate = ["app/core/db/utils.py"]
pytest_add_cli_args_test_selection = ["tests/app/core/db/test_utils.py"]
also_copy = ["settings.yaml", "snippets", "data"]

