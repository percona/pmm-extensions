# Baked PMM-embedded settings profile for the consolidated side-car image.
# Copied to $APP_HOME/settings.yaml by sidecar/Containerfile.sidecar; a bind mount
# at that path replaces it wholesale, which is the operator escape hatch.
#
# One `default:` block only. YamlPrefixConfigSettingsSource deep-merges `default`
# into the FASTAPI_ENV-selected block, so with no second block this file resolves
# identically under the image's baked FASTAPI_ENV=production_docker and under any
# other value -- and AuthSettings sees exactly one auth provider.
#
# Per-deployment inputs (database password, Grafana token, PMM/Nomad endpoints,
# SECRET_KEY) arrive as environment variables, which outrank this file. See
# sidecar/README.md for the contract.
#
# TLS verification is off on every PMM-facing client below: PMM terminates TLS
# with a self-signed certificate the side-car cannot validate from inside the
# container.

default:
  # PMM's nginx forwards the browser's Host verbatim and PMM's public address is
  # deployment-specific, so no narrower value is knowable at image-build time.
  ALLOWED_HOSTS:
    - "*"
  ALLOW_CONCURRENT_SESSIONS: true
  LOGGING: INFO
  SSL_CAFILE: null
  # Set via the BASE_URL environment variable when tasks download scripts or artifacts.
  # The value must include PMM Extensions' URL prefix below, because download URLs are joined
  # onto it rather than replacing its path.
  BASE_URL: null

  # The settings the embedded deployment leaves to an administrator; everything
  # else is refused by the override API because this image provisions it.
  # Unprefixed, so all three services read the same list.
  SETTINGS_OVERRIDE:
    ALLOWED_KEYS:
      - Settings.LOGGING
      - Settings.PMM__annotations_enabled
      - ExtensionsSettings.SYNC_REFRESH_TIME
      - ExtensionsSettings.CONNECTIVITY_CHECK_DEFAULT
      - ExtensionsSettings.FOOTER_TEMPLATE
      - ExtensionsSettings.DIAGNOSTICS_DELIVERY_INPUTS
      - AlertSettings.PROVIDERS
      - AlertSettings.SOURCE_PREFIX
      - AlertSettings.SOURCE_SUFFIX
      - AnonymizerSettings.DEFAULT_ENTITIES
      - TasksSettings.PRE_EXECUTION_CONNECTIVITY_CHECK
      - TasksSettings.LOG_RETENTION_DAYS
      - TasksSettings.PENDING_ALLOCATION_TIMEOUT_SECONDS
      # CREDENTIALS_PATH is deliberately absent: it names a file read off the
      # *monitored* host, not a setting of PMM Extensions' own behavior. SCHEDULE is a nested
      # submodel, so each overridable leaf is listed under its __-delimited path.
      - OmInventorySettings.SCHEDULE__every
      - OmInventorySettings.SCHEDULE__period
      - OmInventorySettings.PROBE_DATABASE
      - OmInventorySettings.REPO_URL
      - OmInventorySettings.REPO_TIMEOUT
      - OmInventorySettings.CONNECT_TIMEOUT
      - OmInventorySettings.TASK_TIMEOUT
      - OmInventorySettings.POLL_INTERVAL
      - OmInventorySettings.MAX_CONCURRENT_PROBES
      - OmInventorySettings.RUN_RETENTION
      - OmInventorySettings.STALE_RUN_AFTER
      # PMM's OpenManager switch reaches ENABLED through the app's own
      # PATCH /config, which this allowlist gates like any other caller: left
      # out, the sweep can never be turned on.
      - OmInventorySettings.ENABLED

  AUTH:
    PROVIDER:
      grafana:
        endpoint: https://pmm-server:8443/graph
        # Left blank deliberately: entrypoint.sh resolves a token at container
        # start — persisted, then minted against Grafana — whenever neither
        # canonical name supplies one.
        service_account_token: ""
        session_cookie_name: pmm_session
        verify_ssl: false

  PMM:
    ENDPOINT: https://pmm-server:8443
    VERIFY_SSL: false
    # Task-lifecycle annotations onto PMM. create_pmm_annotation returns early
    # when API_KEY is unset, which entrypoint.sh fills from the same resolved
    # token, so this is a silent no-op only when that resolution finds nothing.
    ANNOTATIONS_ENABLED: true

  CELERY:
    # Superseded per container start by the credentialed URLs entrypoint.sh mints.
    BROKER_URL: redis://127.0.0.1:6379/0
    RESULT_BACKEND: redis://127.0.0.1:6379/1
    # No BEAT_DBURI: the beat store defaults to the resolved PMM Extensions database, so a
    # mounted DATABASE__PASSWORD or EXTENSIONS__DATABASE__PASSWORD reaches it without an
    # env-visible URI.
    RESULT_EXPIRES: 3600
    WORKER_STATE_DB: celery_worker_state
    # Each prefork child builds its own engines, so this bounds the worker's share
    # of the connection budget recorded above the DATABASE block. Celery's default
    # is one child per CPU the container sees, which is every core on the host.
    WORKER_CONCURRENCY: 4
    BEAT_ENGINE_OPTIONS:
      POOL_PRE_PING: true  # Test beat/worker pooled connections on checkout; set false to opt out
      # No sizing keys. celery-beat runs as its own program here, never forked, so
      # its scheduler engine is a NullPool: MAX_OVERFLOW raises TypeError at beat
      # startup, and POOL_SIZE and POOL_TIMEOUT are dropped. The engines these
      # options do size (one each in extensions and tasks, one per worker child that runs
      # inventory collection) therefore stay at SQLAlchemy's 5 + 10.

  # One database for all three services: PMM_ENABLE_EXTENSIONS provisions exactly
  # the `pmm_extensions` role and database, so this is defined once and aliased
  # below.
  # The aliases are required: the YAML source narrows to `default.<PREFIX>`, so a
  # root-level block is an anchor definition, not a global each service inherits.
  # The alias is one object, so a second profile block must not override a single
  # service's DATABASE keys: the profile merge is in-place and would move all three.
  # test_profile_carries_a_single_default_block keeps this file to one block.

  # Connection budget. PMM gives the `pmm_extensions` role no connection limit;
  # the cap is PostgreSQL's server-wide max_connections of 2000, which every PMM
  # new enough to provision the `pmm_extensions` role sets, shared with
  # pmm-managed (50) and Grafana (100). The side-car holds itself to 10% of it.
  # Worst case with every pool full, where an engine's ceiling is POOL_SIZE +
  # MAX_OVERFLOW:
  #   extensions   2 x 5 + celery-DB 15                    25
  #   inventory    1 x 5                                    5
  #   tasks        2 x 5 + celery-DB 15                    25
  #   worker       parent 2 x 5, plus 4 children x 25     110
  #   beat         2 x 5 + NullPool scheduler              11
  #   sync locks   one held per configured syncer           2
  #                                                total  178 of 200
  # Both extensions and beat reach a service-DB engine they do not own: extensions imports the
  # tasks one through periodic_tasks, and beat loads the worker's task modules
  # because celery beat runs init_worker() before starting the scheduler.
  # Not in the total: the four schema one-shots add 4 at boot, and every sync
  # claim that arrives while another holds the lock briefly opens one more.
  # Each worker child above WORKER_CONCURRENCY: 4 costs another 25, so a fifth
  # child (203) would not fit and 4 is the most the 10% policy allows.
  DATABASE: &shared_database
    ENGINE: postgresql
    HOST: pmm-server
    NAME: pmm_extensions
    PORT: 5432
    USER: pmm_extensions
    POOL_SIZE: 3
    MAX_OVERFLOW: 2
    POOL_TIMEOUT: 10.0
    # `om_schema` is OM's shared symbolic schema token (app/extensions/apps/shared/om/
    # __init__.py); see the equivalent block in the repo-root settings.yaml for the
    # full explanation of SCHEMA_TRANSLATE_MAP.
    SCHEMA_TRANSLATE_MAP:
      om_schema: om

  EXTENSIONS:
    AMBIENT_SESSION_SSO_ENABLED: true
    # PMM ships a hardcoded `location /extensions/` block, so this is fixed topology
    # rather than a per-deployment input. The loopback healthcheck stays
    # unprefixed: routing tolerates a request that arrives without the prefix.
    ROOT_PATH: /extensions
    DATABASE: *shared_database
    # Where diagnostics bundles go once an operator supplies the credentials.
    # The secret names are declared but empty: the plan's cross-reference
    # validator requires every cited name to be declared, and the values arrive
    # through DIAGNOSTICS_DELIVERY_INPUTS. Delivery stays off until they do.
    DIAGNOSTICS_DELIVERY:
      endpoint: https://percona.service-now.com/
      max_bundle_size_mb: 30
      secrets:
        sn_api_key: ""
        client_token: ""
      resolution_steps:
        - name: resolve_ticket
          method: POST
          path: api/pellc/percona_connector/ticket_details
          headers:
            x-sn-apikey: {source: secret, name: sn_api_key}
          body:
            client_token: {source: secret, name: client_token}
            ticket_number: {source: input, field: case_ref}
          outputs:
            table_name: /result/table_name
            ticket_id: /result/ticket_id
      case_search:
        path: api/now/table/sn_customerservice_case
        query:
          # The connector key is refused ServiceNow's full-text index
          # (403 "Field(s) present in the query do not have permission to be
          # read"), so one term is compared against both readable fields
          # instead.
          sysparm_query:
            source: term
            prefix: numberLIKE
            separator: ^ORshort_descriptionLIKE
          sysparm_fields: {source: literal, value: "number,short_description"}
          sysparm_limit: {source: literal, value: "10"}
        headers:
          x-sn-apikey: {source: secret, name: sn_api_key}
        # ServiceNow encoded queries separate clauses with `^`, which has no
        # escape, so the term is held to what a case number or a title fragment
        # actually needs.
        term_pattern: '[A-Za-z0-9 ._-]+'
        results_pointer: /result
        reference_pointer: /number
        title_pointer: /short_description
      # Targets the same table the case search above already reads, so the
      # probe adds no ACL dependency the deployment does not already have.
      probe:
        path: api/now/table/sn_customerservice_case
        query:
          sysparm_limit: {source: literal, value: "1"}
          sysparm_fields: {source: literal, value: sys_id}
        headers:
          x-sn-apikey: {source: secret, name: sn_api_key}
      connection_details:
        path: api/now/table/api_key
        query:
          # Scope the read to the rows this identity owns rather than trusting
          # the api_key row ACL to expose exactly one. It does not single out
          # the key that signed the request: a second key issued to the same
          # identity would make the row returned arbitrary.
          sysparm_query:
            source: literal
            value: "user=javascript:gs.getUserID()"
          # The projection is what keeps `token` and `token_hash` out of the
          # response, not a tidiness preference. Do not widen it.
          sysparm_fields:
            source: literal
            value: "name,active,expires,user.name,user.company.name,user.company.number"
          # Reference fields come back as opaque sys_ids without this, so the
          # account and the company would be reported as unreadable.
          sysparm_display_value: {source: literal, value: "all"}
          sysparm_limit: {source: literal, value: "1"}
        headers:
          x-sn-apikey: {source: secret, name: sn_api_key}
        # Every pointer ends at `display_value` because the parameter above
        # wraps each field as {display_value, value}; one stopping at the field
        # name lands on a container and its pair is dropped in silence.
        details:
          Account name: /result/0/user.company.name/display_value
          Account number: /result/0/user.company.number/display_value
          Key: /result/0/name/display_value
          ServiceNow user: /result/0/user.name/display_value
          Active: /result/0/active/display_value
          Expires: /result/0/expires/display_value
      upload:
        path: api/now/attachment/upload
        headers:
          x-sn-apikey: {source: secret, name: sn_api_key}
          Accept: {source: literal, value: application/json}
        fields:
          table_name: {source: output, step: resolve_ticket, output: table_name}
          table_sys_id: {source: output, step: resolve_ticket, output: ticket_id}
        file_field: uploadFile
        file_content_type: application/zip
        reference_pointer: /result/sys_id
    INVENTORY_ENDPOINT: http://127.0.0.1:9001
    TASKS_ENDPOINT: http://127.0.0.1:9002
    UVICORN_HOST: 0.0.0.0
    UVICORN_PORT: 9000
    PROXY_HEADERS: true
    SSL_CERTFILE: null
    SSL_KEYFILE: null
    APPS:
      - MODULE_NAME: inventory
        # PMM owns the embedded inventory UI; this app is API-only here.
        SIDEBAR: false
      - MODULE_NAME: atw
      - MODULE_NAME: mysql_backups
      # OM's on-host half. It sweeps the MongoDB estate over Nomad for the facts
      # no metric carries and serves them at /api/apps/om_inventory/services,
      # which pmm-managed pulls. The topology and health half is in pmm-managed,
      # so a PMM that ships this app also needs a build carrying
      # managed/services/om.
      - MODULE_NAME: om_inventory
      # OM's bootstrap half: drives MongoDB replica-set bootstrap runs
      # dispatched from the PMM Hosts page. Ships in the same
      # image as om_inventory since both are OM apps; without this entry the
      # app-restricted sidecar build (EXTENSIONS_RESTRICT_APPS=1) strips the
      # om_bootstrap package and pmm-managed's bootstrap dispatch 404s -
      # confirmed against a built image with this entry missing.
      - MODULE_NAME: om_bootstrap
    SYNCERS:
      - SYNCER: PMMSyncer
        STALE_RUN_AFTER: 3600  # Seconds an idle in-progress run may sit before it is reclaimed; must exceed the longest expected sync
        MISSING_GRACE_GENERATIONS: 2  # Consecutive complete syncs that must report an entity absent before it is removed; minimum 2
      - SYNCER: MySQLSyncer
        IGNORE_SCHEMAS:
          - sys
          - performance_schema
          - mysql
          - information_schema
      # Collects the host elevation capability the diagnostics form warns on. This
      # entry only makes the syncer constructible; its cadence is the separate
      # INVENTORY_SYNC_SCHEDULES entry below, and both halves are required.
      - SYNCER: SystemFactsSyncer
      # Measures each never-measured host between the daily SystemFactsSyncer runs.
      # Its cadence is likewise the INVENTORY_SYNC_SCHEDULES entry below.
      - SYNCER: UnmeasuredHostFactsSyncer
        FIRST_MEASUREMENT_RETRIES: 3  # Retries a failing host gets after its first attempt before it is left to the daily run
        FIRST_MEASUREMENT_RETRY_INTERVAL: 3600  # Seconds between two attempts on one host
        FIRST_MEASUREMENT_CONCURRENCY: 8  # First-measurement probes in flight at once
    INVENTORY:
      # PMM re-emits its whole inventory on every sync, so a tombstone here is a
      # genuine removal rather than a gap in a partial feed. Collect daily; the
      # 30-day default retention still applies before anything is deleted.
      COLLECTION_INTERVAL: 1 days

  INVENTORY:
    DATABASE: *shared_database
    UVICORN_HOST: 0.0.0.0
    UVICORN_PORT: 9001
    SSL_CERTFILE: null
    SSL_KEYFILE: null

  TASKS:
    DATABASE: *shared_database
    UVICORN_HOST: 0.0.0.0
    UVICORN_PORT: 9002
    # PENDING_ALLOCATION_TIMEOUT_SECONDS: 3600  # Max seconds a RUNNING row may wait for Nomad to place its work or for its allocation to produce TaskStates before escalating to LOST
    NOMAD:
      # Credential-free so this file validates standalone; the credentialed form
      # arrives as the canonical Nomad endpoint variable.
      ENDPOINT: https://pmm-server:8443/nomad
      SECURE: true
      VERIFY_SSL: false
      SSL_CAFILE: null
      SSL_CERTFILE: null
      SSL_KEYFILE: null
    INVENTORY_SYNC_INTERVAL: 15 minutes
    INVENTORY_SYNC_SYNCER: app.extensions.sync.syncers.pmm.PMMSyncer
    # Daily rather than PMM's 15 minutes: a node's uid and sudo availability change
    # at provisioning time, not during operation, and each run costs a per-node venv
    # build plus a four-driver pip install. The full get_name() form is required
    # here; the SYNCERS entry above takes the short auto-prefixed one. Its first run
    # waits for the PMM default's first completed sync, which then starts it if it
    # has never run. An operator-managed schedule that already covers this syncer
    # replaces this entry and does not wait.
    #
    # The UnmeasuredHostFactsSyncer entry gives a newly added host its first
    # measurement attempt within one PMM inventory-sync interval. It probes only hosts with
    # no observation yet; its retry policy is its SYNCERS entry above.
    # Keep its interval equal to INVENTORY_SYNC_INTERVAL.
    INVENTORY_SYNC_SCHEDULES:
      - SYNCER: app.extensions.sync.syncers.system_facts.syncer.SystemFactsSyncer
        INTERVAL: 1 days
      - SYNCER: app.extensions.sync.syncers.system_facts.syncer.UnmeasuredHostFactsSyncer
        INTERVAL: 15 minutes
    SSL_CERTFILE: null
    SSL_KEYFILE: null
